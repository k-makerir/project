<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
<header class="site-header">
    
    <!-- ЛЕВАЯ ЧАСТЬ -->
    <div class="header-left">
        <a href="#" class="menu-btn">
        <img src="images/menu.svg" alt="Меню" width="26" height="16">
        </a>

        <nav>
            <ul class="navigation">
                <li><a href="#">Home</a></li>
                <li><a href="#">Collections</a></li>
                <li><a href="#">New</a></li>
            </ul>
        </nav>
    </div>

    <!-- ЦЕНТР -->
    <img src="images/icon.svg" alt="Логотип" class="center-icon" width="35" height="35">      

    <!-- ПРАВАЯ ЧАСТЬ -->
    <div class="header-right">

        <a href="#" class="icon-btn">
            <img src="images/heart.svg" alt="Избранное" width="50" height="50">
        </a>

        <a href="#" class="cart-btn">
            <img src="images/cart.svg" alt="Корзина" width="76" height="50">
            <span>Cart</span>
        </a>

        <a href="#" class="shop-btn">
            <img src="images/shop.svg" alt="Shop" width="50" height="50">
        </a>

        <a href="#" class="icon-btn">
            <img src="images/user.svg" alt="Профиль" width="50" height="50">
        </a>

    </div>

</header>
    
    <main class="main">

        <section class="categories">
            <ul>
                <li><a href="#">MEN</a></li>
                <li><a href="#">WOMEN</a></li>
                <li><a href="#">KIDS</a></li>
            </ul>
        </section>

        <form action="/" class="search-form">
            <button type="submit" class="search-btn"></button>
            <input type="text" placeholder="Search">
        </form>

        <section class="new-collection">

            <div class="collection-text">
                <h1>NEW<br>COLLECTION</h1>
                <p>Summer<br>2024</p>

                <div class="shop-row">
                    
                    <button class="shop-btn-main">
                        <span>Go To Shop</span>
                        <img src="images/long_right.svg" alt="long-right">
                    </button>

                    <div class="arrows">
                        <button class="arrow-btn">
                            <img src="images/left.svg" alt="left">
                        </button>

                        <button class="arrow-btn">
                            <img src="images/right.svg" alt="right">
                        </button>
                    </div>

                </div>
            </div>

            <div class="collection-images">
                <img src="images/men_white.jpg" alt="Модель 1">
                <img src="images/black_shirt.jpg" alt="Модель 2">
            </div>

        </section>

    </main>

    <footer>

    </footer>
</body>

</html>
